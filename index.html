
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marea</title>
      <link rel="icon" href="./assets/icons/Marea favicon claro.png" media="(prefers-color-scheme: light)">
      <link rel="icon" href="./assets/icons/logo Marea favicon.png" media="(prefers-color-scheme: dark)">   
</head>
<body>
    <header>
      <img src="assets/img/logo Marea horizontal.png" alt="logo">
      <a href="./explorar.html">Explorar</a>
      <a href="./account.html">Mi cuenta</a>
    </header>

    <main>
      <section class="search-card">
        <form action="">
          <div class="form-group">

            <label for="destination">
              <img src="assets/icons/location.svg" alt="Icono ubicación">
                Indica el destino
              </label>
                <select id="destination" class="input-control">
                  <option value="" disabled selected>A donde vas?</option>
                  <option value="madrid">Madrid</option>
                  <option value="barcelona">Barcelona</option>
                  <option value="paris">París</option>
                </select>
          </div>

          <div class="form-group">

            <label>
              <img src="assets/icons/calendar.svg" alt="Icono fechas">
                Seleccionar fechas
            </label>
            <div class="unified-input-box">
              <input type="date" class="input-date-in" placeholder="Fecha entrada">
              -
              <input type="date" class="input-date-out" placeholder="Fecha salida">
            </div>
          </div>

          <div class="form-group">

            <label>
              <img src="assets/icons/group.svg" alt="Icono ocupacion">
                Selecciona ocupación
            </label>
            <div class="unified-input-box">
              <input type="number" class="input-adults" value="1">
              <input type="number" class="input-kids" value="0">
              <input type="number" class="input-babies" value="0">
          
            </div>
          </div>
          

              

            </form>
      </section>
    </main>
</body>
</html>
